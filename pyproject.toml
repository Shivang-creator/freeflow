[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-flow"
version = "0.1.0"
description = "Universal 100% on-device speech-to-text dictation engine for Apple Silicon with low RAM and instant paste."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shivang Shirodkar" }
]
dependencies = [
    "mlx-whisper>=0.4.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "httpx>=0.25.0",
]

[project.scripts]
whisper-flow = "whisper_flow.main:main"

[tool.setuptools.packages.find]
include = ["whisper_flow*"]
